# The documentation site, built by the pages workflow from the README, doc/ and the examples under examples/ that the
# reference pages pull in. tools/mkdocs_hooks.py serves the README as the index and points each relative link at its
# page, or at its file on GitHub where the site has none.

site_name: xstd-misc
site_description: Miscellaneous extensions to the C++ Standard Library
site_url: https://rhalbersma.github.io/xstd-misc/
repo_url: https://github.com/rhalbersma/xstd-misc
repo_name: rhalbersma/xstd-misc
edit_uri: ""
copyright: Copyright Rein Halbersma 2014-2026, under the Boost Software License, Version 1.0, but for the examples ported from cppreference.com, which are under CC-BY-SA 3.0 and the GFDL

docs_dir: doc
exclude_docs: |
  ideas.*

hooks:
  - tools/mkdocs_hooks.py

nav:
  - Overview: index.md
  - Reference:
    - reference/index.md
    - concepts.hpp:
      - reference/concepts/index.md
      - container_compatible_range.hpp: reference/concepts/container_compatible_range.md
      - hash_algorithm.hpp: reference/concepts/hash_algorithm.md
      - proxy_iterator.hpp: reference/concepts/proxy_iterator.md
      - proxy_reference.hpp: reference/concepts/proxy_reference.md
      - proxy_semi_iterator.hpp: reference/concepts/proxy_semi_iterator.md
      - proxy_semi_reference.hpp: reference/concepts/proxy_semi_reference.md
      - simple_allocator.hpp: reference/concepts/simple_allocator.md
      - specialization_of.hpp: reference/concepts/specialization_of.md
    - type_traits.hpp:
      - reference/type_traits/index.md
      - empty_base_type.hpp: reference/type_traits/empty_base_type.md
      - empty_member_type.hpp: reference/type_traits/empty_member_type.md
      - no_unique_address.hpp: reference/type_traits/no_unique_address.md
      - conditional_data_member.hpp: reference/type_traits/conditional_data_member.md
      - hash_algorithm_is_avalanching.hpp: reference/type_traits/hash_algorithm_is_avalanching.md
      - is_specialization_of.hpp: reference/type_traits/is_specialization_of.md
    - functional.hpp:
      - reference/functional/index.md
      - digest.hpp: reference/functional/digest.md
      - hash.hpp: reference/functional/hash.md
    - format.hpp:
      - reference/format/index.md
      - digest.hpp: reference/format/digest.md
    - utility.hpp:
      - reference/utility/index.md
      - to_underlying.hpp: reference/utility/to_underlying.md
  - Design: design.md
  - Measurements: measurements.md

theme:
  name: material
  features:
    - content.code.copy
    # Each group's page is its section's index, and only the section open expands.
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Each reference page's example and its output, pulled in from examples/ rather than copied, so the page shows what
  # the build compiles and runs. A path that names no file fails the build.
  - pymdownx.snippets:
      base_path: [ . ]
      check_paths: true
  - pymdownx.superfences

validation:
  links:
    anchors: warn
    unrecognized_links: warn
