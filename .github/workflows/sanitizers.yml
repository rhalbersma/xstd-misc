name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: this library is C++20 and builds on every stable rung, which is
  # what the shared workflow defaults to. A repository needing a newer compiler
  # names the rung instead of the version, and this one may yet.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose clang-tidy action counts every header's result rather than the last one's
