name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: this library is C++20 and builds on every stable rung, which is
  # what the shared workflow defaults to. A repository needing a newer compiler
  # names the rung instead of the version, and this one may yet.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@0e9948a4bd9f844797ce5b1c9b4c915a94cd665a # main after rhalbersma/cpp-ci#68, whose install-gcc fails its step when the PPA did not serve the compiler
