name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # MSVC's /analyze, in the role Clang-Tidy fills on the other side. Still no
  # inputs, but the default underneath moved: v0.7.0 runs all three MSVC rungs
  # rather than the qualification one alone, which is what Clang-Tidy has done
  # since v0.6.0. The C++ Core Guidelines checkers stay off until there is a
  # reason to turn them on.
  msvc_analyze:
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose clang-tidy action counts every header's result rather than the last one's
