name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@6f431bb43037778af31b6a7010498e0a2145b381 # main after rhalbersma/cpp-ci#83, which runs the standard libraries' test suites against a library
    with:
      # CMakeLists.txt find_package()s boost_hash2 unconditionally, so every configure here needs vcpkg.
      vcpkg: true
