name: iOS

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladder builds; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # iOS 18, 26 and 27 on arm64: each release's deployment target, which turns libc++'s availability markup on, and
  # the tests run on that release's own simulator runtime.
  ios:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/ios.yml@ad68808302b69e6521722c7fbd41c069f873c41a # main after rhalbersma/cpp-ci#102, which closes the test-suite gaps
