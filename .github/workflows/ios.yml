name: iOS

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladder builds; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # iOS 18, 26 and 27 on arm64: each release's deployment target, which turns libc++'s availability markup on, and
  # the tests run on that release's own simulator runtime.
  ios:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/ios.yml@0e0b8a1ec3476589bb39dc798d41551e18165916 # main after rhalbersma/cpp-ci#90, which adds the layering action
