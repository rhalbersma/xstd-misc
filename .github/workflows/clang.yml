name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  clang:
    uses: rhalbersma/cpp-ci/.github/workflows/clang.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # v0.14.0
