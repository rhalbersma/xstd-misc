name: MinGW

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung the shared workflow offers,
  # which for MinGW is two -- it drops the development rung with a notice
  # rather than failing, as it does for Apple Clang.
  mingw:
    uses: rhalbersma/cpp-ci/.github/workflows/mingw.yml@0e9948a4bd9f844797ce5b1c9b4c915a94cd665a # main after rhalbersma/cpp-ci#68, whose install-gcc fails its step when the PPA did not serve the compiler
