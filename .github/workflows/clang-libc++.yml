name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladder builds; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # This library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  clang_libcxx_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@6f431bb43037778af31b6a7010498e0a2145b381 # main after rhalbersma/cpp-ci#83, which runs the standard libraries' test suites against a library
    with:
      # A pull request builds only the floor and ceiling rungs, in Debug. The
      # all gate cannot see what was skipped, so the nightly canary covers it,
      # building every rung and build type on main.
      reduce_on_pr: true

  # The standard libraries' own tests of the entities with a counterpart, at the stable rung's tags. One rung in
  # Debug, since what is under test is the mapping, not the compiler.
  std_test_suites:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@6f431bb43037778af31b6a7010498e0a2145b381 # main after rhalbersma/cpp-ci#83, which runs the standard libraries' test suites against a library
    with:
      tiers: stable
      build_types: Debug
      cmake_args: -DXSTD_MISC_STD_TEST_SUITES=ON

  # The name branch protection requires: green when the ladder passed, or when
  # the pull request changes nothing the ladder builds.
  all:
    name: clang_libcxx / all
    needs: [ changes, clang_libcxx_ladder, std_test_suites ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.clang_libcxx_ladder.result }}
          SUITES: ${{ needs.std_test_suites.result }}
        run: test "${BUILD}" = false || { test "${RESULT}" = success && test "${SUITES}" = success; }
