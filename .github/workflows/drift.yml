name: Config drift

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

jobs:
  # The xstd family's shared configuration, compared across its repositories, with each one's cpp-ci pin: a report in
  # the step summary that never fails. A difference that stays gets its reason in the file; any other is removed.
  drift:
    name: config drift
    runs-on: ubuntu-24.04
    steps:
      - uses: rhalbersma/cpp-ci/.github/actions/config-drift@46625f976faaa32503d9b73479fb7cff298f66b1
        with:
          repositories: rhalbersma/xstd-misc rhalbersma/xstd-ints rhalbersma/xstd-bits rhalbersma/tabula
          files: .clang-format .clang-tidy CMakePresets.json .gitignore .github/codecov.yml .github/dependabot.yml
