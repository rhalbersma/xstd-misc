name: MSVC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # No inputs: the shared workflow defaults to the MSVC toolset.
  msvc:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # v0.12.0

  # 32-bit MSVC: 8-byte alignment for 64-bit members, and the STL's portable 128-bit integer. One rung in Debug, since what is under test is the target.
  msvc_x86:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@47f850f111f6a0369d8bf184539c3c0c956dd9b3 # cpp-ci#62, repinned to the release tag before merging
    with:
      arch: x86
      tiers: qualification
      build_types: Debug
