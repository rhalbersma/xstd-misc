name: s390x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

# No pull_request: the tests run under QEMU, several times slower than on a native leg, so this leg runs nightly alone.
on:
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Big-endian: the one leg where an integer's first byte is its highest, so a byte copy or a known-answer digest that
  # assumes otherwise fails here and passes everywhere else.
  s390x:
    uses: rhalbersma/cpp-ci/.github/workflows/s390x.yml@47d56c00db0024b6a5a22a0d1e8bec06f40163ff # main after rhalbersma/cpp-ci#87, which adds the Android and iOS legs
