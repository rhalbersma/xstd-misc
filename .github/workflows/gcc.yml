name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@0e9948a4bd9f844797ce5b1c9b4c915a94cd665a # main after rhalbersma/cpp-ci#68, whose install-gcc fails its step when the PPA did not serve the compiler

  # 32-bit x86: a 32-bit size_t, 4-byte alignment for 64-bit integers, and no
  # __int128. One rung in Debug, since what is under test is the target.
  i686:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@0e9948a4bd9f844797ce5b1c9b4c915a94cd665a # main after rhalbersma/cpp-ci#68, whose install-gcc fails its step when the PPA did not serve the compiler
    with:
      arch: x86
      tiers: stable
      build_types: Debug
