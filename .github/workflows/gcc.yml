name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  # canary.yml dispatches this weekly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose clang-tidy action counts every header's result rather than the last one's

  # 32-bit x86: a 32-bit size_t, 4-byte alignment for 64-bit integers, and no
  # __int128. One rung in Debug, since what is under test is the target.
  i686:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # main after rhalbersma/cpp-ci#76, whose clang-tidy action counts every header's result rather than the last one's
    with:
      arch: x86
      tiers: stable
      build_types: Debug
