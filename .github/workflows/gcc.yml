name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # v0.12.0

  # 32-bit x86: a 32-bit size_t, 4-byte alignment for 64-bit integers, and no
  # __int128. One rung in Debug, since what is under test is the target.
  i686:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # v0.12.0
    with:
      arch: x86
      tiers: stable
      build_types: Debug
