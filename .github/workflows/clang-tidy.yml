name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clang_tidy:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-tidy.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      # The generated per-header units, as run-clang-tidy matches them against
      # the compile database's absolute paths. They are the one tree that cannot
      # be named as a directory: they live in the build tree, under a path only
      # this project's CMake knows.
      self_sufficiency_regex: ${{ github.workspace }}/build/test/header_self_sufficiency/.*
      test_dir: test/src
      # Boost.Hash2 and the test suite's Boost libraries, which the manifest
      # installs: once beside the manifest, by the install step, and again under
      # the build tree, by the toolchain file. An absent one is skipped.
      adapted_dirs: >-
        vcpkg_installed/x64-linux/include
        build/vcpkg_installed/x64-linux/include
